[package]
name = "arclet-terminal"
version = "0.1.0"
edition = "2024"
description = "A GTK4 terminal emulator with a libghostty-vt backend prototype"
license = "MIT OR Apache-2.0"

[lib]
name = "arclet_terminal"
path = "src/lib.rs"

[[bin]]
name = "arclet-terminal"
path = "src/main.rs"

[features]
default = ["vte", "alacritty"]
vte = ["dep:vte4"]
alacritty = ["dep:alacritty_terminal"]
ghostty = ["dep:libghostty-vt"]

[dependencies]
alacritty_terminal = { version = "0.26.0", optional = true }
anyhow = "1.0"
base64 = "0.22"
glib = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
libghostty-vt = { version = "0.1.1", optional = true }
portable-pty = "0.9"
vte4 = { version = "0.10", optional = true }
