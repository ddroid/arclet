[package]
name = "arclet-terminal"
version = "0.1.0"
edition = "2024"
description = "A GTK4 terminal emulator with a libghostty-vt backend prototype"
license = "MIT OR Apache-2.0"

[features]
default = ["vte"]
vte = ["dep:vte4"]
ghostty = ["dep:anyhow", "dep:libghostty-vt", "dep:portable-pty"]

[dependencies]
anyhow = { version = "1.0", optional = true }
glib = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
libghostty-vt = { version = "0.1.1", optional = true }
portable-pty = { version = "0.9", optional = true }
vte4 = { version = "0.10", optional = true }
